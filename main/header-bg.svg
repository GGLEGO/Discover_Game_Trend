<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- 스팀 상점 특유의 짙은 남색 → 청회색 그라데이션 -->
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#171a21"/>
      <stop offset="0.45" stop-color="#1b2838"/>
      <stop offset="1" stop-color="#2a475e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#66c0f4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#66c0f4" stop-opacity="0"/>
    </radialGradient>

    <!-- 크랭크(연결봉) 마크: 큰 원과 작은 원을 팔로 이은 모양 -->
    <g id="crank" fill="none" stroke="#66c0f4" stroke-linecap="round">
      <line x1="-46" y1="20" x2="30" y2="-18" stroke-width="20"/>
      <circle cx="30" cy="-18" r="24" stroke-width="10" fill="#1b2838"/>
      <circle cx="30" cy="-18" r="9" stroke-width="6"/>
      <circle cx="-46" cy="20" r="14" stroke-width="8" fill="#1b2838"/>
    </g>

    <!-- 게임 패드 -->
    <g id="pad" fill="#66c0f4">
      <path d="M-30 -14h60a16 16 0 0 1 16 14l5 24a11 11 0 0 1-20 7l-9-13h-44l-9 13a11 11 0 0 1-20-7l5-24a16 16 0 0 1 16-14z"/>
      <g fill="#1b2838">
        <rect x="-26" y="-3" width="16" height="5"/>
        <rect x="-20.500" y="-8.500" width="5" height="16"/>
        <circle cx="16" cy="-4" r="3.500"/>
        <circle cx="25" cy="3" r="3.500"/>
      </g>
    </g>

    <!-- 할인 가격표 -->
    <g id="sale">
      <rect x="-34" y="-14" width="68" height="28" rx="3" fill="#4c6b22"/>
      <text x="0" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#beee11">-50%</text>
    </g>
  </defs>

  <rect width="1600" height="200" fill="url(#base)"/>

  <!-- 상점 게임 캡슐(타일) 격자 -->
  <g fill="#66c0f4" opacity="0.07">
    <rect x="420" y="-10" width="150" height="70" rx="4"/>
    <rect x="585" y="-10" width="150" height="70" rx="4"/>
    <rect x="750" y="-10" width="150" height="70" rx="4"/>
    <rect x="915" y="-10" width="150" height="70" rx="4"/>
    <rect x="500" y="72" width="150" height="70" rx="4"/>
    <rect x="665" y="72" width="150" height="70" rx="4"/>
    <rect x="830" y="72" width="150" height="70" rx="4"/>
    <rect x="995" y="72" width="150" height="70" rx="4"/>
    <rect x="420" y="154" width="150" height="70" rx="4"/>
    <rect x="585" y="154" width="150" height="70" rx="4"/>
    <rect x="750" y="154" width="150" height="70" rx="4"/>
    <rect x="915" y="154" width="150" height="70" rx="4"/>
  </g>

  <rect width="1600" height="200" fill="url(#glow)"/>

  <!-- 오른쪽 큰 원형 엠블럼 -->
  <g transform="translate(1330 100)">
    <circle r="120" fill="#66c0f4" opacity="0.10"/>
    <circle r="120" fill="none" stroke="#66c0f4" stroke-width="2" opacity="0.25"/>
    <use href="#crank" transform="scale(1.9)" opacity="0.38"/>
  </g>

  <!-- 흩어진 소품들 -->
  <use href="#pad" transform="translate(1085 60) rotate(-14) scale(0.9)" opacity="0.22"/>
  <use href="#pad" transform="translate(1540 160) rotate(12) scale(0.75)" opacity="0.18"/>
  <use href="#sale" transform="translate(1130 150) rotate(-6)" opacity="0.55"/>
  <use href="#sale" transform="translate(1500 40) rotate(8) scale(0.8)" opacity="0.4"/>
  <use href="#crank" transform="translate(960 150) scale(0.45)" opacity="0.2"/>

  <!-- 픽셀 장식 (로고의 도트 분위기) -->
  <g fill="#66c0f4">
    <rect x="1010" y="30" width="8" height="8" opacity="0.5"/>
    <rect x="1190" y="96" width="6" height="6" opacity="0.45"/>
    <rect x="1462" y="118" width="8" height="8" opacity="0.4"/>
    <rect x="1576" y="84" width="6" height="6" opacity="0.5"/>
    <rect x="880" y="60" width="6" height="6" opacity="0.3"/>
    <rect x="1240" y="20" width="6" height="6" opacity="0.35"/>
  </g>
</svg>
